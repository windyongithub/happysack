<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="logo.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>happysack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FEFBD8;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b5a;
      --smiley-color: #d4c94a;
      --smiley-hover: #b8ad30;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: none;
    }

    #cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--text-primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, background 0.2s;
      mix-blend-mode: multiply;
    }

    #smiley-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .smiley {
      position: absolute;
      font-size: clamp(14px, 2vw, 22px);
      color: var(--smiley-color);
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: -1px;
      pointer-events: none;
      user-select: none;
      transition: color 0.3s ease;
      will-change: transform;
    }

    .hero {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 6rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fade-up 0.8s ease 0.1s forwards;
    }

    h1 span {
      display: inline-block;
      position: relative;
    }

    h1 span::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background: var(--smiley-hover);
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left;
      animation: underline-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }

    @keyframes underline-in {
      to { transform: scaleX(1); }
    }

    p {
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fade-up 0.8s ease 0.7s forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    a {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 20;
      cursor: none;
    }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div id="smiley-field"></div>

  <main class="hero">
    <h1><span>under construction</span></h1>
    <p>check back soon.</p>
    <p><u>#spreadsacknothate</u></p>
  </main>

  <a href="https://www.instagram.com/happysack.store" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
    <img
      src="instagramyellow.png"
      alt="Instagram"
      width="48"
      height="48"
      style="display: block; transition: opacity 0.2s ease, transform 0.2s ease;"
      onmouseover="this.style.opacity='0.8'; this.style.transform='scale(1.08)'"
      onmouseout="this.style.opacity='1'; this.style.transform='scale(1)'"
    />
  </a>

  <script>
    (() => {
      const COUNT        = 80;
      const REPEL_RADIUS = 110;
      const REPEL_FORCE  = 1.8;
      const FRICTION     = 0.82;
      const RETURN_EASE  = 0.055;

      // Faces flipped to face right, :3 removed
      const FACES = ['(:', 'D:', '(;', '[:'];

      const field  = document.getElementById('smiley-field');
      const cursor = document.getElementById('cursor');
      let mx = -9999, my = -9999;

      window.addEventListener('mousemove', e => {
        mx = e.clientX;
        my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top  = my + 'px';
      });

      window.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

      const smileys = [];

      for (let i = 0; i < COUNT; i++) {
        const el = document.createElement('span');
        el.className = 'smiley';
        el.textContent = FACES[Math.floor(Math.random() * FACES.length)];
        field.appendChild(el);

        const ox = Math.random() * window.innerWidth;
        const oy = Math.random() * window.innerHeight;

        // Each smiley gets a unique drift wave so they all move independently
        smileys.push({
          el,
          ox, oy,
          x: ox, y: oy,
          vx: 0, vy: 0,
          // Float params: random amplitude, speed, and phase per axis
          floatAx: 18 + Math.random() * 28,
          floatAy: 14 + Math.random() * 22,
          floatSpeedX: 0.0004 + Math.random() * 0.0006,
          floatSpeedY: 0.0003 + Math.random() * 0.0005,
          floatPhaseX: Math.random() * Math.PI * 2,
          floatPhaseY: Math.random() * Math.PI * 2,
        });

        el.style.left = ox + 'px';
        el.style.top  = oy + 'px';
      }

      window.addEventListener('resize', () => {
        smileys.forEach(s => {
          s.ox = Math.random() * window.innerWidth;
          s.oy = Math.random() * window.innerHeight;
        });
      });

      let lastTime = null;

      function tick(now) {
        if (!lastTime) lastTime = now;
        const elapsed = now - lastTime;
        lastTime = now;

        smileys.forEach(s => {
          // Floating origin drifts over time with sine waves
          const floatX = Math.sin(now * s.floatSpeedX + s.floatPhaseX) * s.floatAx;
          const floatY = Math.cos(now * s.floatSpeedY + s.floatPhaseY) * s.floatAy;
          const targetX = s.ox + floatX;
          const targetY = s.oy + floatY;

          const dx = s.x - mx;
          const dy = s.y - my;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          if (dist < REPEL_RADIUS) {
            const force = (REPEL_RADIUS - dist) / REPEL_RADIUS * REPEL_FORCE;
            s.vx += (dx / dist) * force * 4;
            s.vy += (dy / dist) * force * 4;
            s.el.style.color = 'var(--smiley-hover)';
          } else {
            s.el.style.color = '';
          }

          // Spring toward the floating target (not the fixed origin)
          s.vx += (targetX - s.x) * RETURN_EASE;
          s.vy += (targetY - s.y) * RETURN_EASE;

          s.vx *= FRICTION;
          s.vy *= FRICTION;

          s.x += s.vx;
          s.y += s.vy;

          s.el.style.left = s.x + 'px';
          s.el.style.top  = s.y + 'px';
          s.el.style.transform = '';
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
