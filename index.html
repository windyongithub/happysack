<!DOCTYPE html>
<html lang="en">
<head>
    <script async type='text/javascript' src='https://static.klaviyo.com/onsite/js/X7VnH6/klaviyo.js?company_id=X7VnH6'></script>
          <script type="text/javascript"> 
          //Initialize Klaviyo object on page load
          !function(){if(!window.klaviyo){window._klOnsite=window._klOnsite||[];try{window.klaviyo=new Proxy({},{get:function(n,i){return"push"===i?function(){var n;(n=window._klOnsite).push.apply(n,arguments)}:function(){for(var n=arguments.length,o=new Array(n),w=0;w<n;w++)o[w]=arguments[w];var t="function"==typeof o[o.length-1]?o.pop():void 0,e=new Promise((function(n){window._klOnsite.push([i].concat(o,[function(i){t&&t(i),n(i)}]))}));return e}}})}catch(n){window.klaviyo=window.klaviyo||[],window.klaviyo.push=function(){var n;(n=window._klOnsite).push.apply(n,arguments)}}}}(); </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>happysack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FEFBD8;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b5a;
      --smiley-color: #d4c94a;
      --smiley-hover: #b8ad30;
      --page-pad: clamp(16px, 3vw, 40px);
    }

    html {
      width: 100%;
      height: 100%;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      display: block;
      min-height: 100vh;
      cursor: none;
      isolation: isolate;
    }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--text-primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, background 0.2s;
      mix-blend-mode: multiply;
      opacity: 0;
    }

    /* ── Smiley canvas ── */
    #smiley-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .smiley {
      position: absolute;
      font-size: clamp(14px, 2vw, 22px);
      color: var(--smiley-color);
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: -1px;
      pointer-events: none;
      user-select: none;
      transition: color 0.3s ease;
      will-change: transform;
    }

    /* ── Hero content ── */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 2rem;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 6rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 1rem;
      white-space: nowrap;
    }

    /* Subtle animated underline */
    h1 span {
      display: inline-block;
      position: relative;
    }

    h1 span::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background: var(--smiley-hover);
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left;
      animation: underline-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }

    @keyframes underline-in {
      to { transform: scaleX(1); }
    }

    p {
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fade-up 0.8s ease 0.7s forwards;
    }

    .signup-form {
      margin: 1.5rem auto 0;
      width: min(92vw, 26rem);
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.65rem;
      opacity: 0;
      animation: fade-up 0.8s ease 0.9s forwards;
    }

    .signup-input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(26, 26, 24, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.38);
      color: var(--text-primary);
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      padding: 0.95rem 1.15rem;
      outline: none;
      box-shadow: 0 10px 30px rgba(26, 26, 24, 0.06);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .signup-input::placeholder {
      color: rgba(107, 107, 90, 0.88);
    }

    .signup-input:focus {
      border-color: rgba(26, 26, 24, 0.34);
      box-shadow: 0 14px 34px rgba(26, 26, 24, 0.1);
      transform: translateY(-1px);
    }

    .signup-button {
      width: 3rem;
      height: 3rem;
      border: 0;
      border-radius: 999px;
      background: var(--smiley-hover);
      color: #1a1a18;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(184, 173, 48, 0.25);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .signup-button:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 14px 28px rgba(184, 173, 48, 0.34);
    }

    .signup-button:focus-visible {
      outline: 2px solid rgba(26, 26, 24, 0.55);
      outline-offset: 3px;
    }

    .signup-button svg {
      width: 1.1rem;
      height: 1.1rem;
      display: block;
      color: #1a1a18;
    }

    .signup-button path {
      stroke: currentColor;
    }

    .signup-status {
      grid-column: 1 / -1;
      min-height: 1.1rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .signup-status.is-visible {
      opacity: 1;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      opacity: 0;
      animation: fade-up 0.8s ease 0.1s forwards;
    }

    .social-link {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 999px;
      transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .social-link:hover {
      transform: scale(1.06);
      background: rgba(0, 0, 0, 0.03);
    }

    .social-link img {
      display: block;
      width: 48px;
      height: 48px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .signup-form,
      .signup-input,
      .signup-button {
        cursor: none;
      }
    }

    @media (hover: none), (pointer: coarse) {
      body {
        cursor: auto;
      }

      #cursor {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div id="smiley-field"></div>

  <div class="ui-layer">
    <main class="hero">
      <h1><span>under construction</span></h1>
      <p>check back soon.</p>
      <p><u>#spreadsacknothate</u></p>
      <form class="signup-form" id="signup-form">
        <label class="sr-only" for="email-input">Email address</label>
        <input
          class="signup-input"
          id="email-input"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="be in the know (mail)"
          required
        />
        <button class="signup-button" type="submit" aria-label="Submit email">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path d="M5 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="signup-status" id="signup-status" aria-live="polite"></div>
      </form>
    </main>
  </div>
  <a
    class="social-link"
    href="https://www.instagram.com/happysack.store"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Follow us on Instagram"
  >
    <img
      src="instagramyellow.png"
      alt="Instagram"
      width="48"
      height="48"
    />
  </a>

  <script>
    (() => {
      const COUNT        = 80;
      const REPEL_RADIUS = 110;
      const REPEL_FORCE  = 1.8;
      const FRICTION     = 0.82;
      const RETURN_EASE  = 0.055;

      // Faces flipped to face right, :3 removed
      const FACES = ['(:', 'D:', '(;', '[:'];

      const field  = document.getElementById('smiley-field');
      const cursor = document.getElementById('cursor');
      const signupForm = document.getElementById('signup-form');
      const signupInput = document.getElementById('email-input');
      const signupStatus = document.getElementById('signup-status');
      const KLAVIYO_SITE_ID = 'X7VnH6';
      const KLAVIYO_LIST_ID = 'VNsxda';
      let mx = -9999, my = -9999;

      const setStatus = (message, visible = true) => {
        signupStatus.textContent = message;
        signupStatus.classList.toggle('is-visible', visible);
      };

      const submitEmail = async (email) => {
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 10000);

        try {
          const response = await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${encodeURIComponent(KLAVIYO_SITE_ID)}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              revision: '2023-02-22',
            },
            body: JSON.stringify({
              data: {
                type: 'subscription',
                attributes: {
                  list_id: KLAVIYO_LIST_ID,
                  custom_source: 'happysack homepage signup form',
                  email,
                },
              },
            }),
            signal: controller.signal,
          });

          if (!response.ok) {
            const details = await response.text();
            throw new Error(`Klaviyo subscription failed (${response.status}): ${details}`);
          }
        } finally {
          window.clearTimeout(timeoutId);
        }
      };

      signupForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = signupInput.value.trim();
        if (!email) {
          setStatus('Please enter an email address.');
          signupInput.focus();
          return;
        }

        signupForm.dataset.submitting = 'true';
        signupStatus.textContent = 'Sending...';
        signupStatus.classList.add('is-visible');

        try {
          await submitEmail(email);
          signupForm.reset();
          setStatus('Thanks, you are on the list.');
        } catch (error) {
          setStatus('Sorry, something went wrong. Please try again.');
        } finally {
          delete signupForm.dataset.submitting;
        }
      });

      window.addEventListener('mousemove', e => {
        mx = e.clientX;
        my = e.clientY;
        cursor.style.opacity = '1';
        cursor.style.left = mx + 'px';
        cursor.style.top  = my + 'px';
      });

      window.addEventListener('mouseleave', () => {
        mx = -9999;
        my = -9999;
        cursor.style.opacity = '0';
      });

      const smileys = [];

      for (let i = 0; i < COUNT; i++) {
        const el = document.createElement('span');
        el.className = 'smiley';
        el.textContent = FACES[Math.floor(Math.random() * FACES.length)];
        field.appendChild(el);

        const ox = Math.random() * window.innerWidth;
        const oy = Math.random() * window.innerHeight;

        smileys.push({
          el,
          ox, oy,
          x: ox, y: oy,
          vx: 0, vy: 0,
          // Float params: random amplitude, speed, and phase per axis
          floatAx: 18 + Math.random() * 28,
          floatAy: 14 + Math.random() * 22,
          floatSpeedX: 0.0004 + Math.random() * 0.0006,
          floatSpeedY: 0.0003 + Math.random() * 0.0005,
          floatPhaseX: Math.random() * Math.PI * 2,
          floatPhaseY: Math.random() * Math.PI * 2,
        });

        el.style.left = ox + 'px';
        el.style.top  = oy + 'px';
      }

      window.addEventListener('resize', () => {
        smileys.forEach(s => {
          s.ox = Math.random() * window.innerWidth;
          s.oy = Math.random() * window.innerHeight;
        });
      });

      let lastTime = null;

      function tick(now) {
        if (!lastTime) lastTime = now;
        const elapsed = now - lastTime;
        lastTime = now;

        smileys.forEach(s => {
          // Floating origin drifts over time with sine waves
          const floatX = Math.sin(now * s.floatSpeedX + s.floatPhaseX) * s.floatAx;
          const floatY = Math.cos(now * s.floatSpeedY + s.floatPhaseY) * s.floatAy;
          const targetX = s.ox + floatX;
          const targetY = s.oy + floatY;

          const dx = s.x - mx;
          const dy = s.y - my;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          if (dist < REPEL_RADIUS) {
            const force = (REPEL_RADIUS - dist) / REPEL_RADIUS * REPEL_FORCE;
            s.vx += (dx / dist) * force * 4;
            s.vy += (dy / dist) * force * 4;
            s.el.style.color = 'var(--smiley-hover)';
          } else {
            s.el.style.color = '';
          }

          // Spring toward the floating target (not the fixed origin)
          s.vx += (targetX - s.x) * RETURN_EASE;
          s.vy += (targetY - s.y) * RETURN_EASE;

          s.vx *= FRICTION;
          s.vy *= FRICTION;

          s.x += s.vx;
          s.y += s.vy;

          s.el.style.left = s.x + 'px';
          s.el.style.top  = s.y + 'px';
          s.el.style.transform = '';
        });

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>

</body>
</html>
